name: Backstage Version Bump

# Tracks the stable "main" Backstage release line. Runs weekly and opens (or
# updates) a single PR bumping every @backstage* dependency together via the
# backstage-cli.
on:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      release:
        description: 'Backstage release line or version to bump to'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  BRANCH_NAME: backstage-version-bump

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # Prefer a PAT so the resulting PR triggers the pr.yaml CI checks; the
      # default GITHUB_TOKEN cannot trigger further workflow runs.
      GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: yarn
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Bump Backstage version
        # versions:bump rewrites @backstage* ranges, backstage.json and the
        # yarn plugin spec, then runs a (mutating) yarn install. The release
        # input is passed via env (never interpolated into the command) so a
        # crafted workflow_dispatch value cannot inject shell commands.
        env:
          RELEASE_LINE: ${{ github.event.inputs.release || 'main' }}
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
        run: yarn backstage-cli versions:bump --release "$RELEASE_LINE"

      - name: Deduplicate dependencies
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
        run: yarn dedupe

      - name: Generate changeset
        run: node scripts/create-version-bump-changeset.js

      # The bump rewrites package.json files and adds a changeset; rerun the
      # repo fixers and prettier so the PR passes `yarn fix --check` and
      # `yarn prettier:check` in CI.
      - name: Apply repo fixes and formatting
        run: |
          yarn fix
          yarn prettier:fix

      - name: Detect changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on the latest Backstage release; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Backstage version
        if: steps.diff.outputs.changed == 'true'
        id: version
        run: echo "value=$(node -p "require('./backstage.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH_NAME"
          git add -A
          git commit -m "chore: bump Backstage to $VERSION"
          git push --force-with-lease origin "$BRANCH_NAME"

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          title="chore: bump Backstage to $VERSION"
          body="Automated bump of all \`@backstage*\` dependencies to Backstage \`$VERSION\` via \`backstage-cli versions:bump\`.

          A changeset has been generated for the affected public packages so the release pipeline publishes them after merge.

          Please review the diff and let CI verify the build before merging."
          if gh pr view "$BRANCH_NAME" --json number --jq '.number' >/dev/null 2>&1; then
            gh pr edit "$BRANCH_NAME" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH_NAME" --title "$title" --body "$body"
          fi
